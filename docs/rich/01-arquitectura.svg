<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="tituloArq descArq">
  <title id="tituloArq">Arquitectura del repositorio cursos-programacion</title>
  <desc id="descArq">Diagrama con dos capas: versions contiene los ZIP inmutables de los cursos de Java y C; docs contiene datasheet, guía de desarrollador, referencias y tres diagramas SVG. README y LICENSE están en la raíz.</desc>

  <defs>
    <pattern id="gridArq" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#122b33" stroke-width="1" opacity="0.55"/>
    </pattern>
    <marker id="flechaArq" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7C99"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#06141b"/>
  <rect width="1200" height="720" fill="url(#gridArq)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#2A9D8F"/>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="64" y="72" fill="#E6F0F3" font-size="32" font-weight="700">cursos-programacion</text>
    <text x="64" y="102" fill="#8FA6B2" font-size="15">Archivo documentado de dos cursos · Java y Lenguaje C</text>
    <text x="1136" y="72" fill="#5B7C99" font-size="13" text-anchor="end">v1.0 · 2026</text>
    <text x="1136" y="92" fill="#5B7C99" font-size="13" text-anchor="end">MIT</text>

    <!-- versions card -->
    <rect x="64" y="140" width="560" height="492" rx="20" fill="#0B1E26" stroke="#24404A" stroke-width="1.5"/>
    <rect x="64" y="140" width="6" height="492" rx="3" fill="#457B9D"/>
    <text x="92" y="178" fill="#D7E3E8" font-size="18" font-weight="600">versions/</text>
    <text x="92" y="200" fill="#8FA6B2" font-size="12.5">Material original · no se modifica</text>

    <!-- Java version -->
    <rect x="92" y="222" width="504" height="158" rx="14" fill="#0F2831" stroke="#2E4A56" stroke-width="1"/>
    <rect x="92" y="222" width="5" height="158" rx="2.5" fill="#457B9D"/>
    <text x="116" y="252" fill="#E6F0F3" font-size="16" font-weight="600">Curso-Java</text>
    <text x="116" y="274" fill="#8FA6B2" font-size="12">CursoJava.zip · 1.216.365 B</text>
    <g fill="#D7E3E8" font-size="12">
      <text x="116" y="302">476 entradas · 163 archivos</text>
      <text x="116" y="322">44 .java · 47 .class · 6 .doc</text>
      <text x="116" y="342">19 módulos · 19 proyectos Maven</text>
    </g>
    <rect x="430" y="238" width="146" height="26" rx="13" fill="#13323D" stroke="#457B9D" stroke-width="1"/>
    <text x="503" y="255" fill="#8FC3D8" font-size="11" text-anchor="middle">cero → intermedio</text>

    <!-- C version -->
    <rect x="92" y="400" width="504" height="158" rx="14" fill="#0F2831" stroke="#2E4A56" stroke-width="1"/>
    <rect x="92" y="400" width="5" height="158" rx="2.5" fill="#2A9D8F"/>
    <text x="116" y="430" fill="#E6F0F3" font-size="16" font-weight="600">Curso-Lenguaje-C-100-Hras</text>
    <text x="116" y="452" fill="#8FA6B2" font-size="12">Laboratorio Curso Lenguaje C.zip · 76.261 B</text>
    <g fill="#D7E3E8" font-size="12">
      <text x="116" y="480">133 entradas · 132 archivos</text>
      <text x="116" y="500">129 .txt con C · 2 .h · 1 GIF</text>
      <text x="116" y="520">8 bloques temáticos · 100 h nominales</text>
    </g>
    <rect x="430" y="416" width="146" height="26" rx="13" fill="#12312F" stroke="#2A9D8F" stroke-width="1"/>
    <text x="503" y="433" fill="#8FD3C9" font-size="11" text-anchor="middle">cero → intermedio</text>

    <text x="92" y="596" fill="#5B7C99" font-size="11.5">Cada carpeta conserva ZIP + README + VERSION.md</text>
    <text x="92" y="616" fill="#5B7C99" font-size="11.5">Integridad verificada con SHA-256 y testzip()</text>

    <!-- arrow -->
    <path d="M 632 386 L 672 386" stroke="#5B7C99" stroke-width="2" marker-end="url(#flechaArq)"/>
    <text x="652" y="374" fill="#5B7C99" font-size="10" text-anchor="middle">describe</text>

    <!-- docs card -->
    <rect x="680" y="140" width="456" height="492" rx="20" fill="#0B1E26" stroke="#24404A" stroke-width="1.5"/>
    <rect x="680" y="140" width="6" height="492" rx="3" fill="#2A9D8F"/>
    <text x="708" y="178" fill="#D7E3E8" font-size="18" font-weight="600">docs/</text>
    <text x="708" y="200" fill="#8FA6B2" font-size="12.5">Documentación y recursos</text>

    <g font-size="13">
      <rect x="708" y="222" width="400" height="58" rx="12" fill="#0F2831" stroke="#2E4A56"/>
      <text x="726" y="246" fill="#D7E3E8" font-weight="600">datasheet.md</text>
      <text x="726" y="266" fill="#8FA6B2" font-size="11.5">Ficha técnica, inventario y soporte</text>

      <rect x="708" y="290" width="400" height="58" rx="12" fill="#0F2831" stroke="#2E4A56"/>
      <text x="726" y="314" fill="#D7E3E8" font-weight="600">developer.md</text>
      <text x="726" y="334" fill="#8FA6B2" font-size="11.5">Arquitectura, validación y extensión</text>

      <rect x="708" y="358" width="400" height="58" rx="12" fill="#0F2831" stroke="#2E4A56"/>
      <text x="726" y="382" fill="#D7E3D8" font-weight="600">REFERENCES.md</text>
      <text x="726" y="402" fill="#8FA6B2" font-size="11.5">Estándares, documentación y bibliografía</text>
    </g>

    <rect x="708" y="426" width="400" height="98" rx="12" fill="#0F2831" stroke="#2E4A56"/>
    <text x="726" y="450" fill="#D7E3E8" font-size="13" font-weight="600">assets/ · 3 SVG</text>
    <g fill="#8FA6B2" font-size="11.5">
      <text x="726" y="472">01-arquitectura.svg</text>
      <text x="726" y="491">02-ruta-java.svg</text>
      <text x="726" y="510">03-ruta-c.svg</text>
    </g>

    <rect x="708" y="540" width="400" height="66" rx="12" fill="#102A33" stroke="#2A9D8F" stroke-width="1"/>
    <text x="726" y="564" fill="#D7E3E8" font-size="13" font-weight="600">README.md + LICENSE</text>
    <text x="726" y="584" fill="#8FA6B2" font-size="11.5">Presentación y licencia MIT · 2026 jmadasme</text>

    <!-- footer -->
    <rect x="64" y="656" width="1072" height="36" rx="10" fill="#0B1E26" stroke="#1D353E"/>
    <circle cx="84" cy="674" r="4" fill="#2A9D8F"/>
    <text x="98" y="678" fill="#8FA6B2" font-size="11.5">ZIP sin extraer · inspección con zipfile · documentación Markdown · sin docs/index.html</text>
    <text x="1116" y="678" fill="#5B7C99" font-size="11.5" text-anchor="end">cursos-programacion</text>
  </g>
</svg>

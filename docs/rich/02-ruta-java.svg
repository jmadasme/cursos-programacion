<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="tituloJava descJava">
  <title id="tituloJava">Ruta de aprendizaje del curso de Java</title>
  <desc id="descJava">Los 19 módulos del curso de Java agrupados en cuatro etapas: entorno, fundamentos y objetos, programación orientada a objetos intermedia, y estructuras y diseño de clases.</desc>

  <defs>
    <pattern id="gridJava" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#122b33" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" fill="#06141b"/>
  <rect width="1200" height="760" fill="url(#gridJava)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#457B9D"/>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="64" y="68" fill="#E6F0F3" font-size="30" font-weight="700">Ruta Java · 19 módulos</text>
    <text x="64" y="96" fill="#8FA6B2" font-size="15">De cero a diseño de clases, con Maven y proyectos ejecutables</text>
    <text x="1136" y="68" fill="#5B7C99" font-size="13" text-anchor="end">Curso-Java · v1.0</text>
    <text x="1136" y="90" fill="#5B7C99" font-size="13" text-anchor="end">44 .java · 20 .xml</text>

    <!-- Etapa 1 -->
    <rect x="64" y="140" width="250" height="272" rx="18" fill="#0B1E26" stroke="#24404A" stroke-width="1.5"/>
    <rect x="64" y="140" width="250" height="6" rx="3" fill="#5B7C99"/>
    <text x="88" y="178" fill="#8FA6B2" font-size="11.5" letter-spacing="1">ETAPA 1</text>
    <text x="88" y="216" fill="#E6F0F3" font-size="22" font-weight="700">Entorno</text>
    <text x="88" y="242" fill="#5B7C99" font-size="12">Módulo 1</text>
    <text x="88" y="268" fill="#D7E3E8" font-size="13">Instalación</text>
    <text x="88" y="290" fill="#8FA6B2" font-size="11.5">JDK · Java 14 · NetBeans</text>
    <text x="88" y="310" fill="#8FA6B2" font-size="11.5">6 documentos .doc</text>
    <rect x="88" y="336" width="202" height="52" rx="10" fill="#0F2831" stroke="#2E4A56"/>
    <text x="100" y="356" fill="#8FA6B2" font-size="10.5">Salida esperada</text>
    <text x="100" y="374" fill="#D7E3E8" font-size="11.5">“Hola Mundo” compilado</text>

    <!-- Etapa 2 -->
    <rect x="338" y="140" width="798" height="272" rx="18" fill="#0B1E26" stroke="#24404A" stroke-width="1.5"/>
    <rect x="338" y="140" width="798" height="6" rx="3" fill="#457B9D"/>
    <text x="362" y="178" fill="#8FA6B2" font-size="11.5" letter-spacing="1">ETAPA 2</text>
    <text x="362" y="208" fill="#E6F0F3" font-size="20" font-weight="700">Fundamentos y objetos</text>
    <text x="362" y="230" fill="#5B7C99" font-size="12">Módulos 2–7</text>

    <g font-size="11.5" fill="#D7E3E8">
      <rect x="362" y="250" width="238" height="36" rx="9" fill="#0F2831" stroke="#2E4A56"/>
      <text x="376" y="273">2 · Clases y objetos</text>
      <rect x="614" y="250" width="238" height="36" rx="9" fill="#0F2831" stroke="#2E4A56"/>
      <text x="628" y="273">3 · Constructores</text>
      <rect x="866" y="250" width="246" height="36" rx="9" fill="#0F2831" stroke="#2E4A56"/>
      <text x="880" y="273">4 · Paso por valor</text>

      <rect x="362" y="298" width="238" height="36" rx="9" fill="#0F2831" stroke="#2E4A56"/>
      <text x="376" y="321">5 · Paso por referencia</text>
      <rect x="614" y="298" width="238" height="36" rx="9" fill="#0F2831" stroke="#2E4A56"/>
      <text x="628" y="321">6 · return y void</text>
      <rect x="866" y="298" width="246" height="36" rx="9" fill="#0F2831" stroke="#2E4A56"/>
      <text x="880" y="321">7 · return de objetos</text>
    </g>

    <path d="M 362 360 L 1112 360" stroke="#1F3A44" stroke-width="1"/>
    <text x="362" y="384" fill="#8FA6B2" font-size="11.5">Objetos, constructores, paso de argumentos y retorno</text>

    <!-- Etapa 3 -->
    <rect x="64" y="432" width="520" height="252" rx="18" fill="#0B1E26" stroke="#24404A" stroke-width="1.5"/>
    <rect x="64" y="432" width="520" height="6" rx="3" fill="#2A9D8F"/>
    <text x="88" y="470" fill="#8FA6B2" font-size="11.5" letter-spacing="1">ETAPA 3</text>
    <text x="88" y="500" fill="#E6F0F3" font-size="20" font-weight="700">POO intermedia</text>
    <text x="88" y="522" fill="#5B7C99" font-size="12">Módulos 8–16</text>

    <g font-size="11" fill="#D7E3E8">
      <rect x="88" y="540" width="150" height="32" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="100" y="561">8 · this</text>
      <rect x="249" y="540" width="150" height="32" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="261" y="561">9 · null</text>
      <rect x="410" y="540" width="150" height="32" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="422" y="561">10 · Encapsulamiento</text>

      <rect x="88" y="582" width="150" height="32" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="100" y="603">11 · static</text>
      <rect x="249" y="582" width="150" height="32" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="261" y="603">12 · Herencia</text>
      <rect x="410" y="582" width="150" height="32" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="422" y="603">13 · Constructores</text>

      <rect x="88" y="624" width="150" height="32" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="100" y="645">14 · Sobrecarga</text>
      <rect x="249" y="624" width="150" height="32" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="261" y="645">15 · Paquetes</text>
      <rect x="410" y="624" width="150" height="32" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="422" y="645">16 · final</text>
    </g>

    <!-- Etapa 4 -->
    <rect x="608" y="432" width="528" height="252" rx="18" fill="#0B1E26" stroke="#24404A" stroke-width="1.5"/>
    <rect x="608" y="432" width="528" height="6" rx="3" fill="#5B7C99"/>
    <text x="632" y="470" fill="#8FA6B2" font-size="11.5" letter-spacing="1">ETAPA 4</text>
    <text x="632" y="500" fill="#E6F0F3" font-size="20" font-weight="700">Estructuras y diseño</text>
    <text x="632" y="522" fill="#5B7C99" font-size="12">Módulos 17–19</text>

    <g font-size="12" fill="#D7E3E8">
      <rect x="632" y="540" width="480" height="34" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="648" y="562">17 · Arreglos de objetos</text>
      <rect x="632" y="584" width="480" height="34" rx="8" fill="#0F2831" stroke="#2E4A56"/>
      <text x="648" y="606">18 · Matrices y recorridos</text>
      <rect x="632" y="628" width="480" height="34" rx="8" fill="#2A9D8F" stroke="#2A9D8F"/>
      <text x="648" y="650" fill="#06141b" font-weight="700">19 · Diseño: Producto, Orden, Ventas</text>
    </g>

    <!-- footer -->
    <rect x="64" y="708" width="1072" height="34" rx="10" fill="#0B1E26" stroke="#1D353E"/>
    <circle cx="84" cy="725" r="4" fill="#2A9D8F"/>
    <text x="98" y="729" fill="#8FA6B2" font-size="11.5">Progresión acumulativa · proyectos Maven pequeños · sin dependencias externas</text>
    <text x="1116" y="729" fill="#5B7C99" font-size="11.5" text-anchor="end">Java 12/14</text>
  </g>
</svg>
